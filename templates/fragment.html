{% extends "base.html" %}
{% block title %}По фрагменту{% endblock %}
{% block content %}
<section class="page-card card gothic-card fade-in">
    <h2 class="page-title">🧱 Восстановление по фрагменту</h2>
    <form method="POST" action="/fragment" enctype="multipart/form-data">
        <div class="form-grid">
            <div class="form-group full-width">
                <label for="file">📁 Фрагмент</label>
                <input type="file" name="file" id="file" accept="image/*" required>
            </div>
            <div class="form-group">
                <label for="frag-style">🏛️ Стиль</label>
                <select name="style" id="frag-style">
                    {% for s in styles %}
                    <option value="{{ s }}">{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="mode">🔧 Режим</label>
                <select name="mode" id="mode">
                    <option value="img2img">img2img — достроить</option>
                    <option value="outpainting">outpainting — расширить</option>
                </select>
            </div>
            <div class="form-group full-width">
                <label for="frag-description">✍️ Подсказка</label>
                <textarea name="description" id="frag-description" rows="3"
                          placeholder="Что известно о здании..."></textarea>
            </div>
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-primary gothic-btn">🧱 Восстановить</button>
        </div>
        <p class="hint">⏳ AI Horde: 1–10 мин</p>
    </form>

    {% if result %}
    <div class="result gothic-result">
        <img src="{{ result.image }}" alt="Восстановление">
        <div class="result-meta">
            <div><strong>Движок:</strong> {{ result.engine }}</div>
            <details><summary>📋 Промпт</summary><pre>{{ result.prompt }}</pre></details>
            <div class="result-actions">
                <a class="btn btn-secondary" href="{{ result.image }}" download>⬇️ Скачать</a>
                <form method="POST" action="/feedback" class="feedback-form">
                    <input type="hidden" name="image_id" value="{{ result.id }}">
                    <button type="submit" name="rating" value="like" class="btn-like">👍 Верно</button>
                    <button type="submit" name="rating" value="dislike" class="btn-dislike">👎 Ошибка</button>
                </form>
            </div>
        </div>
    </div>
    {% endif %}
</section>
{% endblock %}
